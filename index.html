<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin-Rock-Paper-Scissors</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Let's Play Rock Paper Scissors!</h1>
    <p class="round-outcome">Click a button and see if you win!</p>
    <div class="score-container">
        <div class="score player">
            <p class="score-text">Your Score:</p>
            <p class="score-point">0</p>
        </div>
        <div class="score computer">
            <p class="score-text">Computer's Score:</p>
            <p class="score-point">0</p>
        </div>
    </div>
    <div class="button-container">
        <button id="rock">rock</button>
        <button id="paper">paper</button>
        <button id="scissors">scissors</button>
    </div>
</body>
</html>
